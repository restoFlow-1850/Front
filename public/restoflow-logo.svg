<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Cloche dome -->
  <ellipse cx="100" cy="130" rx="65" ry="10" fill="#1B2A3D"/>
  <path d="M35 130 C35 80 60 45 100 45 C140 45 165 80 165 130" fill="#1B2A3D"/>
  <!-- Cloche handle -->
  <rect x="92" y="32" width="16" height="14" rx="4" fill="#1B2A3D"/>
  <!-- Shine on dome -->
  <path d="M65 110 C65 85 78 65 100 65" stroke="#2A3F55" stroke-width="8" stroke-linecap="round" fill="none"/>
  <!-- Gold swoosh -->
  <path d="M30 140 C60 130 120 130 170 120" stroke="#C49A3C" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M25 148 C55 138 125 138 175 128" stroke="#C49A3C" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- Bottom plate line -->
  <line x1="30" y1="132" x2="170" y2="132" stroke="#1B2A3D" stroke-width="3"/>
  <!-- Text: Resto -->
  <text x="35" y="178" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#1B2A3D" letter-spacing="-1">Resto</text>
  <!-- Text: Flow -->
  <text x="118" y="178" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="38" fill="#C49A3C" letter-spacing="-1">Flow</text>
  <!-- Decorative dots -->
  <circle cx="88" cy="192" r="2.5" fill="#C49A3C"/>
  <circle cx="100" cy="192" r="2.5" fill="#C49A3C"/>
  <circle cx="112" cy="192" r="2.5" fill="#C49A3C"/>
  <!-- Decorative lines -->
  <line x1="55" y1="192" x2="80" y2="192" stroke="#C49A3C" stroke-width="1.5"/>
  <line x1="120" y1="192" x2="145" y2="192" stroke="#C49A3C" stroke-width="1.5"/>
</svg>
